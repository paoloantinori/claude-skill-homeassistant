# Workflow: Full End-to-End Verification

**Purpose**: Complete testing cycle for automation changes with comprehensive validation

**When to use**: After modifying an automation, before considering it "done"

**Timeout**: 60 seconds (full verification cycle)

**Steps**:
```yaml
1. validate_config:
    command: "ssh -oVisualHostKey=no ha 'ha core check'"
    timeout: 10
    exit_on_failure: true
    error_message: "Config validation failed. Fix errors before deploying."

2. deploy_changes:
    method: "scp"  # or "git" based on user context
    source: "{{local_file}}"
    target: "ha:/homeassistant/"
    timeout: 10

3. reload_automations:
    command: "source .env && hass-cli service call automation.reload"
    timeout: 5
    wait: 2

4. manual_trigger:
    command: "source .env && hass-cli service call automation.trigger --arguments entity_id={{automation_name}}"
    timeout: 5

5. monitor_execution:
    command: "timeout 30 ssh -oVisualHostKey=no ha 'ha core logs -f'"
    filter: "grep -E '{{automation_name}}|Triggered|Executing|Error|Completed'"
    timeout: 30
    capture_trace: true

6. verify_outcome:
    depends_on: "automation_type"
    methods:
      notification: "Check logs for telegram/Alexa notification sent"
      state_change: "Verify entity state changed to expected value"
      script: "Confirm script executed without errors"
    timeout: 10

7. report:
    format: "structured_pass_fail_warn"
    include:
      - validation_result
      - deployment_success
      - reload_success
      - execution_trace
      - verification_result
      - overall_status
      - recommendations
```

**Output Template**:
```
[STATUS] {{emoji}} Automation Verification Complete

Automation: {{automation_name}}
Overall: {{overall_status}} (PASS|FAIL|WARN)

Step-by-Step Results:
{{#each step}}
{{emoji}} {{step_name}}: {{status}} - {{description}}
{{/each}}

Execution Trace:
{{#each trace_step}}
{{emoji}} {{timestamp}}: {{message}}
{{/each}}

Verification:
{{#if verification_passed}}
✅ Expected outcome: {{expected_outcome}}
✅ Confirmation: {{verification_method}}
{{/if}}
{{#if verification_failed}}
❌ Expected outcome: {{expected_outcome}}
❌ Actual: {{actual_outcome}}
{{/if}}

{{#if failed}}
Diagnosis:
   → Action: {{suggested_action}}
   → Reference: {{documentation_link}}
{{/if}}

[STATUS] {{closing_statement}}
```

