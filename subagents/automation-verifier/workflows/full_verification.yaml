**Failure Example**:
```
[STATUS] 🚨 Automation Verification Failed

Automation: automation.my_broken
Overall: FAIL

Step-by-Step Results:
✅ Config validation: PASS - No errors detected
✅ Deployment: PASS - Deployed via scp
✅ Reload: PASS - Automations reloaded successfully
✅ Trigger: PASS - Manual trigger successful
🚨 Execution: FAIL - Error detected after 2.1 seconds
❌ Verification: FAIL - Expected notification not sent

Execution Trace:
✅ 14:32:15: Triggered by: manual
🚨 14:32:16: Error executing script: Invalid data for call_service
   → Service: notify.telegram
   → Error: Extra keys not allowed @ data['invalid_key']

Diagnosis:
   → Action: Check service call parameters in action step 2
   → Test: hass-cli service call notify.telegram --help
   → Reference: HA Manager skill docs/06_common_mistakes.md (Mistake 4)
   → Fix: Remove invalid_key from service call data

[STATUS] Automation needs fixes before deployment.
```

**Parameters**:
- `automation_name`: Entity ID of automation to test
- `local_file`: Path to automation file (if using scp deploy)
- `automation_type`: Type of verification (notification, state_change, script)
- `expected_outcome`: What should happen when automation fires

**Usage Examples**:
```yaml
# Test notification automation
full_verification(
  automation_name: "automation.telegram_test",
  local_file: "automations/telegram_test.yaml",
  automation_type: "notification",
  expected_outcome: "Telegram message sent"
)

# Test state change automation
full_verification(
  automation_name: "automation.light_toggle",
  local_file: "automations/lights.yaml",
  automation_type: "state_change",
  expected_outcome: "switch.light changes from off to on"
)
```
