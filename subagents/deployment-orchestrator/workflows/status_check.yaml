**Server Has Changes Example**:
```
[STATUS] ⚠️ Deployment Status Report

Local Git:
  Branch: master
  Status: Clean (no changes)

Server Git:
  Branch: master
  Status: 2 files have uncommitted changes
  Uncommitted changes:
    → automations/test.yaml
    → scripts/my_script.yaml

Components:
  Automations: 156
  Scripts: 42
  Templates: 12

Recent Logs:
  ⚠️ Warnings: 1
  → Entity 'sensor.test_sensor' unavailable

Recommendations:
  → Server has uncommitted changes
  → Review changes: ssh ha "cd /homeassistant && git diff"
  → If safe: Commit or discard changes
  → If external: Investigate source of changes

Deployment Ready: NO (server has uncommitted changes)

[STATUS] Review server changes before deploying.
```

