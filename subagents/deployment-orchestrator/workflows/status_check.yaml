[STATUS] Fix errors before deploying.
```

**Parameters**:
- `check_logs`: Whether to check recent logs (default: true)
- `log_lines`: Number of log lines to check (default: 30)
- `show_recommendations`: Whether to show deployment recommendations (default: true)

**Usage Examples**:
```yaml
# Quick status check
status_check()

# Comprehensive status with more log lines
status_check(
  check_logs: true,
  log_lines: 100,
  show_recommendations: true
)

# Status check without log analysis
status_check(
  check_logs: false
)
```
