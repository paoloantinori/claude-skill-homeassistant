# Workflow: Deployment Status Check

**Purpose**: Check deployment state and identify potential issues

**When to use**: Before deployment, after deployment, or troubleshooting

**Timeout**: 45 seconds (comprehensive status check)

**Steps**:
```yaml
1. check_local_git:
    command: "git status --short"
    timeout: 5
    parse_output: true
    extract_changes: true

2. check_server_git:
    command: "ssh -oVisualHostKey=no ha 'cd /homeassistant && git status'"
    timeout: 10
    parse_output: true
    extract_state: true

3. check_component_status:
    command: "source .env && hass-cli state list | grep -E '^(automation|script|template)\\.' | wc -l"
    timeout: 10
    parse_output: true

4. check_recent_logs:
    command: "timeout 10 ssh -oVisualHostKey=no ha 'ha core logs | tail -30'"
    timeout: 15
    parse_errors: true
    extract_warnings: true

5. report:
    format: "status_report"
    include:
      - local_git_state
      - server_git_state
      - component_counts
      - recent_errors
      - recent_warnings
      - recommendations
      - deployment_ready
```

**Output Template**:
```
[STATUS] {{emoji}} Deployment Status Report

Local Git:
  Branch: {{local_branch}}
  Status: {{local_status}}
{{#if has_local_changes}}
  Changes:
{{#each local_change}}
    → {{file}} ({{status}})
{{/each}}
{{/if}}

Server Git:
  Branch: {{server_branch}}
  Status: {{server_status}}
{{#if has_server_changes}}
  Uncommitted changes:
{{#each server_change}}
    → {{file}}
{{/each}}
{{/if}}

Components:
  Automations: {{automation_count}}
  Scripts: {{script_count}}
  Templates: {{template_count}}

Recent Logs:
{{#if has_errors}}
  🚨 Errors: {{error_count}}
{{#each error}}
  → {{error_message}}
{{/each}}
{{/if}}

{{#if has_warnings}}
  ⚠️ Warnings: {{warning_count}}
{{#each warning}}
  → {{warning_message}}
{{/each}}
{{/if}}

{{#if no_errors}}
  ✅ No errors in last 30 log lines
{{/if}}

Recommendations:
{{#each recommendation}}
  → {{recommendation}}
{{/each}}

Deployment Ready: {{ready_status}}

[STATUS] {{closing_message}}
```

**Healthy System Example**:
```
[STATUS] ✅ Deployment Status Report

Local Git:
  Branch: master
  Status: Clean (no changes)

Server Git:
  Branch: master
  Status: Clean (working tree clean)

Components:
  Automations: 156
  Scripts: 42
  Templates: 12

Recent Logs:
  ✅ No errors in last 30 log lines
  ⚠️ Warnings: 2
  → Template variable 'maybe_undefined' may not exist
  → Entity 'sensor.offline_device' unavailable

Recommendations:
  → System healthy, ready for deployment
  → Consider reviewing template variable warnings
  → Check offline_device availability if critical

Deployment Ready: YES

[STATUS] System healthy, ready for deployment.
```

