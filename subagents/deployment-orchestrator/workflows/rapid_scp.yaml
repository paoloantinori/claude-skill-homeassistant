**Parameters**:
- `files`: List of files to deploy
- `remote_path`: Remote path relative to /homeassistant/ (default: same as local)
- `affected_components`: List of components to reload
- `test_entities`: List of entities to verify after deployment
- `iteration_count`: Track number of iterations (auto-incremented)

**Usage Examples**:
```yaml
# Deploy single file
rapid_scp(
  files: ["automations/test.yaml"],
  affected_components: ["automation"],
  test_entities: ["automation.test"]
)

# Deploy multiple files with custom path
rapid_scp(
  files: [
    "automations/test.yaml",
    "scripts/my_script.yaml"
  ],
  remote_path: "automations/test",
  affected_components: ["automation", "script"],
  test_entities: ["automation.test", "script.my_script"]
)

# Deploy templates
rapid_scp(
  files: ["templates/sensor.yaml"],
  remote_path: "",
  affected_components: ["template"],
  test_entities: ["sensor.test_template"]
)
```
