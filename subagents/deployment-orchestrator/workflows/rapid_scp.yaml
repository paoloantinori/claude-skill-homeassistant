# Workflow: Rapid SCP Deployment (Testing)

**Purpose**: Fast deployment iteration during development and testing

**When to use**: Still testing changes, need rapid iteration

**Timeout**: 30 seconds (fast iteration cycle)

**Steps**:
```yaml
1. quick_validate:
    command: "python3 -c \"import yaml; yaml.safe_load(open('{{file}}'))\""
    timeout: 5
    for_each: "{{files}}"
    catch_errors: true

2. deploy_via_scp:
    command: "scp {{file}} ha:/homeassistant/{{remote_path}}/"
    timeout: 10
    for_each: "{{files}}"
    parse_output: true

3. reload_components:
    command: "source .env && hass-cli service call {{component}}.reload"
    timeout: 10
    parse_output: true

4. quick_test:
    command: "source .env && hass-cli state get {{test_entity}}"
    timeout: 10
    parse_output: true

5. report:
    format: "rapid_scp_report"
    track_iterations: true
    remind_git_sync: true
    include:
      - files_deployed
      - iteration_count
      - deployment_time
      - reload_status
      - test_results
```

**Output Template**:
```
[STATUS] {{emoji}} Rapid SCP Deployment Complete

Method: SCP (Testing)
Files deployed: {{file_count}}
Iterations: {{iteration_count}}
Time: {{deployment_time}}s

Deployment Steps:
{{#each step}}
{{emoji}} {{step_name}}: {{status}} - {{description}}
{{/each}}

{{#if has_test_results}}
Test Results:
{{#each test}}
✅ {{entity}}: {{state}}
{{/each}}
{{/if}}

⚠️ Reminder: Commit to git when testing is complete!
→ Use "SCP + Git Sync" workflow to finalize

[STATUS] {{closing_message}}
```

