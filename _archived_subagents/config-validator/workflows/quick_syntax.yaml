# Workflow: Quick Syntax Check

**Purpose**: Fast YAML syntax validation during development

**When to use**: While editing automation/script/template files, before deploying

**Timeout**: 20 seconds (rapid syntax checking)

**Steps**:
```yaml
1. identify_files:
    pattern: "*.yaml"
    scope: "modified or specified files"
    timeout: 5

2. yaml_syntax_check:
    for_each: "identified_files"
    command: "python3 -c \"import yaml; yaml.safe_load(open('{{file}}'))\""
    timeout: 5
    catch_errors: true
    parse_errors: true

3. basic_ha_check:
    command: "timeout 15 ssh -oVisualHostKey=no ha 'ha core check'"
    timeout: 20
    parse_output: true

4. report:
    format: quick_syntax_report
    include:
      - files_checked
      - syntax_errors
      - line_numbers
      - error_context
      - ha_core_errors
      - safe_to_edit
```

**Output Template**:
```
[STATUS] {{emoji}} Quick Syntax Check Complete

Files checked: {{file_count}}
Errors: {{error_count}}
Warnings: {{warning_count}}

{{#if error_count > 0}}
Syntax Errors:
{{#each error}}
🚨 {{file}}:{{line}}
   Error: {{error_message}}
   Context:
   {{context}}
   → Action: {{fix_recommendation}}
{{/each}}
{{/if}}

{{#if warning_count > 0}}
Warnings:
{{#each warning}}
⚠️ {{warning_message}}
{{/each}}
{{/if}}

{{#if error_count == 0 && warning_count == 0}}
✅ All files validated successfully
{{#each file}}
✅ {{file}}: Valid YAML
{{/each}}
{{/if}}

Safe to continue editing: {{safe_to_edit}}
```

**Success Example**:
```
[STATUS] ✅ Quick Syntax Check Complete

Files checked: 3
Errors: 0
Warnings: 0

✅ automations/test.yaml: Valid YAML
✅ scripts/my_script.yaml: Valid YAML
✅ templates/sensor.yaml: Valid YAML

All files validated successfully
Safe to continue editing: YES
```

**Error Example**:
```
[STATUS] 🚨 Syntax Errors Detected

Files checked: 3
Errors: 1
Warnings: 0

Syntax Errors:
🚨 automations/test.yaml:5
   Error: mapping values are not allowed here
   Context:
     4:   alias: Test
     5: automation: Test  ← Line 5
     6:     trigger:
         → Action: Fix YAML indentation, check for syntax errors
         → Tip: Use 2 spaces for indentation, not tabs

Safe to continue editing: NO
```

**Multiple Errors Example**:
```
[STATUS] 🚨 Multiple Syntax Errors Detected

Files checked: 4
Errors: 2
Warnings: 1

Syntax Errors:
🚨 scripts/broken.yaml:8
   Error: could not find expected ':'
   Context:
     7:   action:
     8:     service: .notifier.telegram  ← Line 8
     9:       data:
         → Action: Fix indentation, ensure proper YAML structure

🚨 templates/error.yaml:12
   Error: unexpected character in stream
   Context:
     11: value_template: >
     12: "{{ states('sensor.x) }}"  ← Line 12 (unclosed quote)
     13:
         → Action: Fix template syntax (unclosed quote)

Warnings:
⚠️ automations/deprecated.yaml:15
   → Uses deprecated service parameter
   → Action: Consider updating to new parameter

Safe to continue editing: NO
```

**Parameters**:
- `files`: Specific files to check (optional, if not provided checks recent changes)
- `show_context`: Number of lines to show around error (default: 3)

**Usage Examples**:
```yaml
# Check specific files
quick_syntax(
  files: ["automations/test.yaml", "scripts/my_script.yaml"]
)

# Check all YAML in directory
quick_syntax(
  files: ["automations/**/*.yaml"]
)
```
