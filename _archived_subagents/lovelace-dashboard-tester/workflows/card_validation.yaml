Cards: 132 checked
Errors: 1
Warnings: 2

Invalid Cards:
🚨 lovelace.control_center, view 2, card 5
   → Type: entities-card (typo, should be "entities")
   → Issue: Unknown card type
   → Action: Fix card type to "entities"

Template Warnings:
⚠️ lovelace.control_center, view 3, card 7
