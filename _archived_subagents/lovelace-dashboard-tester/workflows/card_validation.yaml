   → Action: Ensure variable exists or use default value

[STATUS] 1 invalid card needs fixing.
```

**Known Valid Card Types**:
```yaml
Standard cards:
  - entity
  - entities
  - glance
  - history-graph
  - picture-elements
  - picture-entity
  - picture-glance
  - state-switch
  - state-label
  - thermostat
  - vertical-stack
  - horizontal-stack
  - grid
  - markdown
  - sensor
  - gauge
  - custom:config-template-card
  - custom:button-card
  - custom:mini-graph-card
```

**Parameters**:
- `dashboard_files`: Specific dashboards to check (optional, if not provided checks all)
- `check_templates`: Whether to validate template expressions (default: true)
- `check_custom_cards`: Whether to validate custom card installations (default: false)

**Usage Examples**:
```yaml
# Validate cards for all dashboards
card_validation()

# Validate cards for specific dashboard
card_validation(
  dashboard_files: [".storage/lovelace.control_center"]
)

# Validate without template checking
card_validation(
  check_templates: false
)
```
