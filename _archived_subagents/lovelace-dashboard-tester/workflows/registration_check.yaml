# Workflow: Dashboard Registration Check

**Purpose**: Verify dashboards are properly registered in lovelace_dashboards

**When to use**: After creating new dashboard, dashboard not appearing in sidebar

**Timeout**: 25 seconds (registry check + file listing + cross-reference)

**Steps**:
```yaml
1. read_registry:
    file: ".storage/lovelace_dashboards"
    timeout: 5
    parse_json: true

2. list_dashboard_files:
    pattern: ".storage/lovelace.*"
    exclude: ["lovelace_dashboards"]
    timeout: 5

3. cross_reference:
    compare: "registry vs files"
    identify:
      - missing_registrations
      - orphaned_registrations
    timeout: 5

4. report:
    format: "registration_report"
    include:
      - registered_dashboards
      - unregistered_dashboards
      - orphaned_registrations
      - registration_status
```

**Output Template**:
```
[STATUS] {{emoji}} Dashboard Registration Check Complete

Registered: {{registered_count}} dashboards
Unregistered: {{unregistered_count}} dashboards
Orphaned: {{orphaned_count}} registrations

{{#if registered_dashboards}}
Registered Dashboards:
{{#each registered}}
✅ {{title}} ({{filename}})
   → ID: {{id}}
   → URL: /{{url_path}}
   → Icon: {{icon}}
{{/each}}
{{/if}}

{{#if unregistered_dashboards}}
Unregistered Dashboards:
{{#each unregistered}}
🚨 {{name}} ({{filename}})
   → Action: Add to .storage/lovelace_dashboards
   → Required: HA restart after registration
   → Registration template: {{registration_template}}
{{/each}}
{{/if}}

{{#if orphaned_registrations}}
Orphaned Registrations:
{{#each orphan}}
⚠️ {{title}} ({{id}})
   → File: {{expected_file}} not found
   → Action: Remove registration or create dashboard file
{{/each}}
{{/if}}

[STATUS] {{closing_message}}
```

