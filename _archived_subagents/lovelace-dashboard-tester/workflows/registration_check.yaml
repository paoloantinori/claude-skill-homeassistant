**Orphaned Registration Example**:
```
[STATUS] ⚠️ Dashboard Registration Check Complete

Registered: 3 dashboards
Unregistered: 0 dashboards
Orphaned: 1 registration

Registered Dashboards:
✅ control-center (lovelace.control_center)
✅ my-home (lovelace.my_home)
✅ tablet (lovelace.tablet)

Orphaned Registrations:
⚠️ Old Dashboard (old_dashboard)
   → File: .storage/lovelace.old_dashboard not found
   → Action: Remove registration or create dashboard file

[STATUS] 1 orphaned registration found.
```

**Parameters**:
- `registry_file`: Path to registry file (default: .storage/lovelace_dashboards)
- `dashboard_pattern`: Pattern for dashboard files (default: .storage/lovelace.*)

**Usage Examples**:
```yaml
# Check registration for all dashboards
registration_check()

# Check specific registry file
registration_check(
  registry_file: ".storage/lovelace_dashboards"
)

# Check specific dashboard pattern
registration_check(
  dashboard_pattern: ".storage/lovelace.*"
)
```
